name: Deploy Novidia Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: novidia-frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      - name: Prepare release
        run: |
          mkdir -p release
          cp -a .next release/.next
          if [ -d public ]; then cp -a public release/public; fi
          cp next.config.ts release/next.config.ts

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Upload release
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -p "$VPS_PORT" \
            "novidia-frontend-deploy@$VPS_HOST" \
            'mkdir -p /home/novidia-frontend-deploy/releases/current'
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519 -p $VPS_PORT" \
            release/ \
            "novidia-frontend-deploy@$VPS_HOST:/home/novidia-frontend-deploy/releases/current/"

      - name: Diagnose deployment access
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o ConnectTimeout=10 \
            -p "$VPS_PORT" \
            "novidia-frontend-deploy@$VPS_HOST" \
            'id; sudo -n -l; ls -ld "$HOME/releases" "$HOME/releases/current"'